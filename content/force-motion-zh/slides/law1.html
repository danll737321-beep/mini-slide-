<p style="font-size:34px;line-height:1.5">物體很「懶」。靜止的東西保持靜止，運動的東西會以<b>相同速度沿直線</b>一直走下去。</p>
<p style="font-size:40px;font-weight:800;line-height:1.35;background:#FBFCFA;padding:24px 32px;border-radius:16px">合力為零 → 運動狀態不變</p>
<p style="font-size:30px;line-height:1.5;color:#4F5F64"><b style="color:#B4521F">迷思：</b>運動的東西需要一直有人推。<br/><b style="color:#2463B8">事實：</b>冰球會自己滑行，會停下來只是因為摩擦力讓它變慢。</p>
