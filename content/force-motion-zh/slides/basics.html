<section data-section="Before you start: speed, acceleration and force" data-transition="fade" id="basics" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:800;letter-spacing:3px;color:#B4521F">開始之前</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.1">先認識四個詞</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:800">速率</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">每秒走多遠。<b style="color:#18262B">10 m/s</b> 就是每秒走 10 公尺。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:800">加速度</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">每秒速度變化多少。0 → 10 → 20 m/s 就是 <b style="color:#18262B">10 m/s²</b>。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:800">力</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">推或拉，單位是<b style="color:#18262B">牛頓（N）</b>。拿著一顆蘋果大約要 1 N。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:800">合力</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">所有力加起來的結果。向左 5 N ＋ 向右 5 N ＝ <b style="color:#18262B">0 N</b>。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">力與運動 · 4</p>
<aside>藍色卡片描述運動本身，橘色卡片描述造成運動的原因。「合力」是後面三條定律的關鍵：如果推力互相抵消，合力就是零。</aside>
</section>
