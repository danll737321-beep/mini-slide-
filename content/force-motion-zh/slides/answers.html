<p style="font-size:28px;line-height:1.5;color:#BFCDC9">慣性讓它繼續滾，是摩擦力讓它慢下來。</p>

<p style="font-size:44px;font-weight:800">對</p>

<p style="font-size:28px;line-height:1.5;color:#BFCDC9">作用力與反作用力永遠一樣大。車會動，是因為作用在車上的合力不是零。</p>
