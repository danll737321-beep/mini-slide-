<h2 style="font-size:72px;font-weight:900;line-height:1.1">越重的東西掉得越快嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.05">不會。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:34px;line-height:1.5">重的東西受到的重力比較大，但它也<b>比較難加速</b>（F = ma），兩個效果剛好抵消。</p>
<p style="font-size:34px;line-height:1.5">沒有空氣阻力時，鐵鎚和羽毛會<b>同時落地</b>。太空人在 1971 年於月球上示範過。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">力與運動 · 12</p>
<aside>在地球上羽毛掉得慢，只是因為空氣阻力。課堂上可以試：把一張攤平的紙和一本書一起丟（紙掉得慢），再把紙揉成一團一起丟，兩者幾乎同時落地。月球上的示範是阿波羅 15 號太空人大衛・史考特做的。</aside>
