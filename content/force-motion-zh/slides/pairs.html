<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:800;letter-spacing:3px;color:#B4521F">常見的混淆</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.1">作用力與反作用力，還是力平衡？</h2>
</div>
<table style="font-size:30px;color:#18262B">
<tr><th style="width:34%;text-align:left">比較</th><th style="width:33%;text-align:left">作用力與反作用力</th><th style="width:33%;text-align:left">力平衡</th></tr>
<tr><td>作用在</td><td><b>兩個</b>不同物體</td><td><b>同一個</b>物體</td></tr>
<tr><td>大小相同？</td><td>永遠相同</td><td>平衡時相同</td></tr>
<tr><td>會互相抵消？</td><td>不會（作用在不同物體）</td><td>會，合力 = 0</td></tr>
<tr style="background:#E1ECFA"><td>例子</td><td>你推牆，牆推你</td><td>重力把書往下拉，桌子把書往上撐</td></tr>
</table>
<div style="flex:1"></div>
<p style="font-size:32px;line-height:1.5"><b style="color:#B4521F">快速判斷：</b>問「每個力作用在哪個物體上？」兩個物體 = 作用力與反作用力；同一個物體 = 力平衡。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">力與運動 · 9</p>
<aside>桌上的書是經典陷阱。重力和桌子的支撐力都作用在書上，所以是力平衡，不是作用力與反作用力。重力的反作用力，是書把地球往上拉。</aside>
