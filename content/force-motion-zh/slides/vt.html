<section data-section="Reading a velocity–time graph" data-transition="fade" id="vt" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:800;letter-spacing:3px;color:#B4521F">速度–時間圖</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.1">從圖上看懂運動</h2>
</div>
<div style="display:grid;grid-template-columns:860px 1fr;gap:56px;align-items:center;flex:1">
<div style="position:relative;width:860px;height:560px">
<svg aria-label="速度–時間圖：前 5 秒速度從 0 直線上升到每秒 20 公尺，之後保持 20 直到第 10 秒；線下方的面積塗成藍色" height="560" viewbox="0 0 860 560" width="860">
<polygon fill="#C9DBF2" points="120,460 420,140 720,140 720,460"></polygon>
<line stroke="#18262B" stroke-width="4" x1="120" x2="790" y1="460" y2="460"></line>
<line stroke="#18262B" stroke-width="4" x1="120" x2="120" y1="460" y2="60"></line>
<line stroke="#9AAAA6" stroke-dasharray="8 8" stroke-width="2" x1="120" x2="720" y1="140" y2="140"></line>
<line stroke="#9AAAA6" stroke-dasharray="8 8" stroke-width="2" x1="420" x2="420" y1="460" y2="140"></line>
<polyline fill="none" points="120,460 420,140 720,140" stroke="#2463B8" stroke-linejoin="round" stroke-width="8"></polyline>
</svg>
<p style="position:absolute;left:40px;top:120px;width:70px;font-size:24px;text-align:right">20</p>
<p style="position:absolute;left:40px;top:440px;width:70px;font-size:24px;text-align:right">0</p>
<p style="position:absolute;left:400px;top:476px;width:40px;font-size:24px;text-align:center">5</p>
<p style="position:absolute;left:695px;top:476px;width:50px;font-size:24px;text-align:center">10</p>
<p style="position:absolute;left:560px;top:516px;width:260px;font-size:24px;color:#4F5F64">時間（s）</p>
<p style="position:absolute;left:0px;top:20px;width:300px;font-size:24px;color:#4F5F64">速度（m/s）</p>
<p style="position:absolute;left:130px;top:170px;width:170px;font-size:24px;font-weight:800;color:#2463B8">越陡 = 加速度越大</p>
<p style="position:absolute;left:450px;top:270px;width:240px;font-size:24px;font-weight:800">藍色面積 = 距離</p>
</div>
<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:32px;line-height:1.5">線的<b style="color:#2463B8">斜率</b> = 加速度。水平線代表等速。</p>
<p style="font-size:32px;line-height:1.5">線下方的<b style="color:#2463B8">面積</b> = 移動的距離。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">力與運動 · 10</p>
<aside>用手指沿著線走：前 5 秒往上爬（加速），之後變平（等速）。下一張會把數字算出來。</aside>
