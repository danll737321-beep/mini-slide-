<p style="font-size:24px;color:#4F5F64">穿溜冰鞋推朋友一下：兩個人都會滑開。</p>

<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5">你推一個東西，它也會用<b>一樣大</b>的力、朝<b>相反方向</b>推回你。</p>
<p style="font-size:36px;font-weight:800;line-height:1.35;background:#FBFCFA;padding:24px 32px;border-radius:16px">力總是成對出現：大小相等、方向相反，作用在兩個不同的物體上。</p>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">例子：火箭把氣體往下推，氣體就把火箭往上推。</p>
