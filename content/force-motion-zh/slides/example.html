<section data-transition="fade" id="example" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:800;letter-spacing:3px;color:#B4521F">例題</p>
<h2 style="font-size:64px;font-weight:900;line-height:1.15">一輛車 5 秒內從 0 加速到 20 m/s，接著以 20 m/s 再開 5 秒。</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">1</p>
<h3 style="font-size:36px;font-weight:800">加速度（前 5 秒）</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:30px;line-height:1.6">a = 20 ÷ 5<br/>  = 4 m/s²</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">2</p>
<h3 style="font-size:36px;font-weight:800">距離：三角形</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:30px;line-height:1.6">½ × 5 × 20<br/>= 50 m</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">3</p>
<h3 style="font-size:36px;font-weight:800">距離：長方形</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:30px;line-height:1.6">5 × 20<br/>= 100 m</p>
</div>
</div>
<p style="font-size:44px;font-weight:800;background:#E1ECFA;padding:28px 40px;border-radius:20px">10 秒內總距離：50 + 100 = <span style="color:#2463B8">150 m</span></p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">力與運動 · 11</p>
<aside>這就是上一張的圖。加速度是斜率：5 秒內速度增加 20 m/s。距離是面積：分成三角形（加速）和長方形（等速）兩塊來算。</aside>
</section>
