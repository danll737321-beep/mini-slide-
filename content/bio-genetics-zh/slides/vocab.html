<section id="vocab" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;font-weight:800;color:#B4521F;letter-spacing:3px">關鍵詞</p>
<h2 style="font-size:64px;font-weight:900;line-height:1.15">大寫 A = 顯性，小寫 a = 隱性</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px">
<div style="background:#FBFCFA;border:1px solid #D3DCD8;border-radius:16px;padding:40px;display:flex;flex-direction:column;gap:12px">
<h3 style="font-size:44px;font-weight:800;color:#B4521F">基因</h3>
<p style="font-size:28px;color:#4F5F64">控制一個性狀的遺傳單位</p>
</div>
<div style="background:#FBFCFA;border:1px solid #D3DCD8;border-radius:16px;padding:40px;display:flex;flex-direction:column;gap:12px">
<h3 style="font-size:44px;font-weight:800;color:#B4521F">顯性（A）</h3>
<p style="font-size:28px;color:#4F5F64">只要有一個就會表現出來</p>
</div>
<div style="background:#FBFCFA;border:1px solid #D3DCD8;border-radius:16px;padding:40px;display:flex;flex-direction:column;gap:12px">
<h3 style="font-size:44px;font-weight:800;color:#B4521F">隱性（a）</h3>
<p style="font-size:28px;color:#4F5F64">要有兩個（aa）才會表現出來</p>
</div>
<div style="background:#FBFCFA;border:1px solid #D3DCD8;border-radius:16px;padding:40px;display:flex;flex-direction:column;gap:12px">
<h3 style="font-size:44px;font-weight:800;color:#B4521F">基因型／表現型</h3>
<p style="font-size:28px;color:#4F5F64">字母組合，例如 Aa／看得到的性狀，例如紫色</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">遺傳：顯性與隱性 · 3</p>
<aside>強調寫法：大寫字母是顯性，同一個字母的小寫是隱性。基因型是寫出來的，表現型是看得到的。</aside>
</section>
