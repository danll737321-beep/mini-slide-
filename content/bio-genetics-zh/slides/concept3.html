<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5">AA 和 Aa 都是紫色：<b>表現型</b>相同，<b>基因型</b>不同。</p>
<p style="font-size:34px;line-height:1.5">Aa 植物是<b>帶因者</b>：它藏著白色基因，還能傳給後代。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">想知道的話，讓它和白花（aa）雜交，看看會不會出現白花。</p>
