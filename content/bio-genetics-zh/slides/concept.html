<section id="concept" data-section="基因怎麼傳下去" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">

<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">基因怎麼傳下去</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">親代各傳一個字母給後代</h2>
</div>
<div style="display:grid;grid-template-columns:640px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">

<p style="font-size:24px;color:#4F5F64">親代都是 Aa，各自有一半機會傳 A、一半機會傳 a。</p>
</div>
<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5">親代有兩個字母，但只會傳<b>一個</b>下去。</p>
<p style="font-size:34px;line-height:1.5">傳哪一個完全靠機率，就像擲硬幣。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">後代 = 媽媽的一個字母 + 爸爸的一個字母。</p>
</div>
</div>
