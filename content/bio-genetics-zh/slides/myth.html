<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#FBF3EE">最常見的迷思</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">已經生了 3 株紫花，第 4 株一定是白花嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.05">不一定。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:34px;line-height:1.5">每個後代都是<b>新的機會</b>。不管前面生了什麼，每一株開白花的機率都是 4 分之 1。</p>
<p style="font-size:34px;line-height:1.5">就像擲硬幣：連續三次正面，第四次出現反面的機率也不會變大。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">遺傳：顯性與隱性 · 12</p>
<aside>3 : 1 是後代很多時才會接近的比例，不是每四個就一定照這個比例。</aside>
