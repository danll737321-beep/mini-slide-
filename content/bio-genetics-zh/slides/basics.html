<section id="basics" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">開始之前</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">先認識四個詞</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">基因</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">控制一個性狀（例如花色）的指令。每個生物有<b style="color:#18262B">兩份</b>，爸媽各給一份。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">顯性（A）</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">只要有<b style="color:#18262B">一份</b>就會表現出來。用大寫字母表示。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">隱性（a）</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">要有<b style="color:#18262B">兩份</b>（aa）才會表現出來。用小寫字母表示。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">基因型／表現型</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">字母組合（Aa）／看得到的性狀（紫色）。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">遺傳：顯性與隱性 · 4</p>
<aside>強調寫法：大寫是顯性，同一個字母的小寫是隱性。基因型是寫出來的，表現型是看得到的。</aside>
</section>
