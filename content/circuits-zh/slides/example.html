<section id="example" data-transition="fade" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">

<h2 style="font-size:64px;font-weight:900;line-height:1.2">9 伏特的電池接上 3 歐姆的燈泡，電流是多少？</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">1</p>
<h3 style="font-size:36px;font-weight:700">寫下已知</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">V = 9 V<br>R = 3 Ω</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">2</p>
<h3 style="font-size:36px;font-weight:700">選公式</h3>
<p style="font-size:32px;line-height:1.6">要找電流，所以用<br><b style="font-family:'JetBrains Mono', 'Courier New', monospace">I = V ÷ R</b></p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">3</p>
<h3 style="font-size:36px;font-weight:700">代入計算</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">I = 9 ÷ 3<br>&#160;&#160;= 3</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">4</p>
<h3 style="font-size:36px;font-weight:700">加上單位</h3>
<p style="font-size:32px;line-height:1.6">電流的單位是安培<br><b style="font-family:'JetBrains Mono', 'Courier New', monospace">3 A</b></p>
</div>
</div>
<p style="font-size:44px;font-weight:700;background:#E1ECFA;padding:28px 40px;border-radius:20px">答案：電流是 <span style="color:#2463B8">3 安培</span></p>
