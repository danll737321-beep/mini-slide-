<section data-transition="fade" id="three" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<h2 style="font-size:72px;font-weight:900;line-height:1.15">電路的三個主角</h2>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;background:#FBFCFA;padding:48px;border:2px solid #D3DCD8;border-top:12px solid #B4521F;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:96px;font-weight:700;line-height:1.1;color:#B4521F">V</p>
<h3 style="font-size:44px;font-weight:700">電壓</h3>
<p style="font-size:32px;color:#4F5F64">單位：伏特（V）</p>
<p style="font-size:32px;line-height:1.5"><b>推力</b>：馬達推水的力道，也就是水壓。</p>
<p style="font-size:24px;line-height:1.5;color:#4F5F64">一顆電池 1.5 V，家裡插座約 110 V。</p>
</div>
<div style="display:flex;flex-direction:column;gap:16px;background:#FBFCFA;padding:48px;border:2px solid #D3DCD8;border-top:12px solid #2463B8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:96px;font-weight:700;line-height:1.1;color:#2463B8">I</p>
<h3 style="font-size:44px;font-weight:700">電流</h3>
<p style="font-size:32px;color:#4F5F64">單位：安培（A）</p>
<p style="font-size:32px;line-height:1.5"><b>流量</b>：每秒有多少水流過同一個點。</p>
<p style="font-size:24px;line-height:1.5;color:#4F5F64">流得越多，燈泡越亮。</p>
</div>
<div style="display:flex;flex-direction:column;gap:16px;background:#FBFCFA;padding:48px;border:2px solid #D3DCD8;border-top:12px solid #18262B;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:96px;font-weight:700;line-height:1.1;color:#18262B">R</p>
<h3 style="font-size:44px;font-weight:700">電阻</h3>
<p style="font-size:32px;color:#4F5F64">單位：歐姆（Ω）</p>
<p style="font-size:32px;line-height:1.5"><b>阻擋</b>：管子變細或塞住，水很難通過。</p>
<p style="font-size:24px;line-height:1.5;color:#4F5F64">燈泡就是一個電阻，燈絲被擠得發熱發亮。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">電路與歐姆定律 · 5</p>
<aside>一句話記住：電壓是推力、電流是流量、電阻是阻擋。單位分別是伏特、安培、歐姆。</aside>
</section>
