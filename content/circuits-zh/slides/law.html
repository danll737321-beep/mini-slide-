<p style="font-size:44px;font-weight:700;line-height:1.4">想求電流？<span style="color:#7FB0F2">I = V ÷ R</span>　推力 ÷ 阻擋 = 流量</p>
<p style="font-size:24px;line-height:1.5;color:#BFCDC9">為什麼電流用 I？它來自法文 intensité（強度），是歷史留下來的習慣。</p>
