<section id="water" data-section="用水管比喻認識電壓、電流、電阻三個主角" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">把電路想成水管</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">電路就像一圈裝滿水的水管</h2>
</div>
<div style="display:grid;grid-template-columns:640px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">
<svg aria-label="一圈水管，左邊有抽水馬達推水，上方有一段變細的管子，水沿著管子繞圈流動" width="640" height="420" viewBox="0 0 640 420">
<path d="M80 70 H560 V360 H80 Z" fill="none" stroke="#9CC0EA" stroke-width="44" stroke-linejoin="round"/>
<path d="M80 70 H560 V360 H80 Z" fill="none" stroke="#2463B8" stroke-width="6" stroke-dasharray="18 22" stroke-linejoin="round"/>
<rect x="250" y="44" width="140" height="52" fill="#E7EEEA"/>
<rect x="250" y="60" width="140" height="20" fill="#9CC0EA" stroke="#B4521F" stroke-width="5"/>
<circle cx="80" cy="215" r="62" fill="#18262B"/>
<path d="M58 245 L80 180 L102 245 Z" fill="#E58A55"/>

<p style="font-size:24px;color:#4F5F64">馬達推水，水在管子裡繞圈；上方細管就是燈泡。</p>
</div>
<table style="font-size:32px;color:#18262B">
<tr><th style="width:42%;text-align:left">水管世界</th><th style="width:58%;text-align:left">電路世界</th></tr>
<tr><td>抽水馬達</td><td><b>電池</b> battery</td></tr>
<tr><td>水管</td><td><b>電線</b> wire</td></tr>
<tr><td>管子裡的水</td><td><b>電子</b> electron</td></tr>
<tr><td>一段變細的管子</td><td><b>燈泡</b>（電阻）bulb</td></tr>
</table>
</div>
<p style="font-size:32px;line-height:1.5;background:#FBFCFA;padding:24px 32px;border-radius:16px">重點：電線裡<b style="color:#B4521F">本來就擠滿電子</b>。電池不是生出電子，而是「推」它們。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">電路與歐姆定律 · 4</p>
<aside>學生常以為電池會「生出」電。強調：金屬電線裡本來就有大量電子，就像水管本來就裝滿水。電池只是負責推。這一點到最後破解迷思時會再用到。</aside>
</section>
