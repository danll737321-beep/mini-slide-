<div style="display:flex;flex-direction:column;gap:32px">
<p style="font-size:36px;line-height:1.5">燈泡一個接一個排成一條線，像<b>糖葫蘆</b>串在同一根竹籤上。</p>
<p style="font-size:36px;line-height:1.5">一顆壞掉，就像水管中間被剪斷：<b style="color:#B4521F">整條路不通，全部熄滅</b>。</p>
<p style="font-size:36px;line-height:1.5">燈泡越多，阻擋加起來越大，<b>每一顆越暗</b>。</p>
<p style="font-size:28px;line-height:1.5;color:#4F5F64">例子：老式聖誕燈串。（現在很多燈串有設計可以繞過壞掉的燈泡。）</p>
</div>
