<table style="font-size:34px;color:#18262B">
<tr><th style="width:36%;text-align:left">比較</th><th style="width:32%;text-align:left">串聯（糖葫蘆）</th><th style="width:32%;text-align:left">並聯（交流道）</th></tr>
<tr><td>電流的路有幾條</td><td>一條</td><td>很多條</td></tr>

<p style="font-size:36px;font-weight:700;line-height:1.4">一句話記住：串聯是「一條路，一個壞全部停」；並聯是「很多條路，各管各的」。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">電路與歐姆定律 · 12</p>
<aside>亮度題先讓學生預測：兩顆一樣的燈泡接同一顆電池，並聯的每顆燈泡拿到全部電壓，串聯的要平分，所以並聯比較亮。</aside>
