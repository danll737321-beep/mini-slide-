<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#FBF3EE">最常見的迷思</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">電流流過燈泡之後，會變少嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.1">不會。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:36px;line-height:1.5">串聯電路裡，燈泡前面和後面的電流<b>一樣大</b>。燈泡用掉的是電子帶的<b>能量</b> energy，不是電子本身。</p>
<p style="font-size:36px;line-height:1.5">就像水流過水車：水車轉了，<b>水一滴也沒少</b>。電池「沒電」是能量用完了，不是電子跑光了。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">電路與歐姆定律 · 14</p>
<aside>回扣第 4 張：電線裡本來就擠滿電子，電池只是推它們。電池給電子能量，燈泡把能量變成光和熱，電子繼續繞圈回到電池。</aside>
</section>
