<p style="font-size:24px;color:#4F5F64">中間那顆壞了，左右兩顆照樣亮。</p>

<div style="display:flex;flex-direction:column;gap:32px">
<p style="font-size:36px;line-height:1.5">從主線分出很多條分支，像高速公路的<b>交流道</b>，每條分支各接一顆燈泡。</p>
<p style="font-size:36px;line-height:1.5">一條分支壞了，只有那條沒電：<b style="color:#2463B8">其他照樣亮</b>。</p>
<p style="font-size:36px;line-height:1.5">每條分支都直接接到電池兩端，<b>每顆燈泡都拿到全部的電壓</b>。</p>
<p style="font-size:28px;line-height:1.5;color:#4F5F64">例子：家裡的燈、冰箱、電視，教室裡的日光燈。</p>
</div>
