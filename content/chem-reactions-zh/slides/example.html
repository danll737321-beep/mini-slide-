<section id="example" data-transition="fade" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">一步一步平衡</p>
<h2 style="font-size:64px;font-weight:900;line-height:1.15">CH₄ + O₂ → CO₂ + H₂O</h2>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">1</p>
<h3 style="font-size:36px;font-weight:700">數 C</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">1 = 1 ✓</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">2</p>
<h3 style="font-size:36px;font-weight:700">平衡 H</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">左邊 4 個 H<br>→ 2H₂O</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">3</p>
<h3 style="font-size:36px;font-weight:700">平衡 O</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">右邊 4 個 O<br>→ 2O₂</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">4</p>
<h3 style="font-size:36px;font-weight:700">檢查</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">C 1=1<br>H 4=4<br>O 4=4</p>
</div>
</div>
<p style="font-size:44px;font-weight:700;background:#E1ECFA;padding:28px 40px;border-radius:20px">CH₄ + <span style="color:#2463B8">2</span>O₂ → CO₂ + <span style="color:#2463B8">2</span>H₂O</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">化學反應與質量守恆 · 8</p>
<aside>平衡時只改係數（前面的大數字）。H 和 O 如果出現在好幾個地方，就留到最後再平衡。</aside>
</section>
