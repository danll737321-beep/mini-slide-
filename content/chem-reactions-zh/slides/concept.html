<p style="font-size:34px;line-height:1.5">化學反應中，原子<b>不會被創造，也不會消失</b>。</p>
<p style="font-size:34px;line-height:1.5">它們拆開、再用新的方式組合，變成新的物質。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">反應前後原子一樣 → 總質量也一樣。</p>
