<section data-transition="fade" id="concept" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<h2 style="font-size:72px;font-weight:900;line-height:1.1">核心概念</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">1 原子重新排列</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">原子不會被創造或消滅，所以總質量不變。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">2 為什麼 A 組變輕</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">CO₂ 氣體跑到空氣中了，質量並沒有消失。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">3 改係數，不改下標</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">改了下標就變成另一種物質：H₂O → H₂O₂</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">4 莫耳</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">1 莫耳 = 6 × 10²³ 個粒子<br/>質量（g）= 莫耳數 × 分子量</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">化學反應與質量守恆 · 4</p>
