<section id="example2" data-transition="fade" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">例題</p>
<h2 style="font-size:64px;font-weight:900;line-height:1.15">要讓 16 g 的 CH₄ 完全燃燒，需要多少克 O₂？</h2>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">1</p>
<h3 style="font-size:36px;font-weight:700">CH₄ 的莫耳數</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">16 ÷ 16<br>= 1 莫耳</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">2</p>
<h3 style="font-size:36px;font-weight:700">看係數比</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">CH₄ : O₂<br>= 1 : 2</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">3</p>
<h3 style="font-size:36px;font-weight:700">O₂ 的莫耳數</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">1 × 2<br>= 2 莫耳</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">4</p>
<h3 style="font-size:36px;font-weight:700">O₂ 的質量</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">2 × 32<br>= 64 g</p>
</div>
</div>
<p style="font-size:44px;font-weight:700;background:#E1ECFA;padding:28px 40px;border-radius:20px">答案：需要 <span style="color:#2463B8">64 g</span> 的 O₂</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">化學反應與質量守恆 · 11</p>
<aside>用前面平衡好的反應式。係數代表莫耳數的比，不是質量的比。</aside>
</section>
