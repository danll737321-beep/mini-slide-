<section data-transition="fade" id="myth" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<h2 style="font-size:72px;font-weight:900;line-height:1.1">是對還是錯？</h2>
<div style="display:flex;flex-direction:column;gap:24px">
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">1　「蠟燭越燒越輕，所以質量沒有守恆。」</p>
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">2　「要平衡 H₂ + O₂ → H₂O，只要把生成物改成 H₂O₂ 就好。」</p>
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">3　「係數的比就是質量的比。」</p>
</div>
<p style="font-size:28px;color:#4F5F64">說說看每一句錯在哪裡。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">化學反應與質量守恆 · 5</p>
<aside>三句都是錯的。1：產生的 CO₂ 和 H₂O 跑到空氣中了。2：改下標就變成另一種物質，正確的反應式是 2H₂ + O₂ → 2H₂O。3：係數代表莫耳數的比，不是質量的比。</aside>
</section>
