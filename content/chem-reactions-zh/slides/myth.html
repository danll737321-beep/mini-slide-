<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#FBF3EE">最常見的迷思</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">蠟燭越燒越輕，質量消失了嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.05">沒有。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:34px;line-height:1.5">蠟和氧氣反應，變成 <b>CO₂ 和水蒸氣</b>。兩者都是氣體，飄走了，秤就秤不到。</p>
<p style="font-size:34px;line-height:1.5">把蠟燭放在<b>密封罐</b>裡、放在秤上燒，讀數就不會變。所有原子都還在。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">化學反應與質量守恆 · 12</p>
<aside>相反的驚喜：鋼絲絨燃燒後會變重，因為它從空氣中得到了氧。兩種情況遵守的是同一條規則。</aside>
