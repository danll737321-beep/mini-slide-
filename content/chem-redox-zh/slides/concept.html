<section data-transition="fade" id="concept" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:32px">
<h2 style="font-size:72px;font-weight:900;line-height:1.1">核心概念</h2>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px">
<div style="display:flex;flex-direction:column;gap:10px;background:#FBFCFA;padding:32px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">1 得氧或失氧</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">得到氧 = 氧化<br/>失去氧 = 還原</p>
</div>
<div style="display:flex;flex-direction:column;gap:10px;background:#FBFCFA;padding:32px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">2 一定成對</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">一種物質失去氧時，另一種物質同時得到氧。</p>
</div>
<div style="display:flex;flex-direction:column;gap:10px;background:#FBFCFA;padding:32px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">3 氧化劑與還原劑</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">還原劑把氧搶過來，自己被氧化。</p>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#F7E6DC;padding:32px;border-radius:16px">
<h3 style="font-size:32px;font-weight:800">4 活性大小（大 → 小）</h3>
<p style="font-size:28px;line-height:1.45;color:#18262B">K &gt; Na &gt; Ca &gt; Mg &gt; Al &gt; <b>C</b> &gt; Zn &gt; <b>Fe</b> &gt; Sn &gt; Pb &gt; <b>H</b> &gt; <b>Cu</b> &gt; Hg &gt; Ag &gt; Pt &gt; Au</p>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">煉鐵：Fe₂O₃ + 3CO → 2Fe + 3CO₂（碳的活性比鐵大，所以把氧搶走）</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">氧化與還原 · 4</p>
<aside>活性大的元素可以把活性小的元素從化合物中置換出來。回扣開場：鐵的活性比銅大，所以把銅從溶液中置換出來。</aside>
</section>
