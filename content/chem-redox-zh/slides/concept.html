<section id="concept" data-section="得氧與失氧" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">一定成對</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">一個失去氧，另一個就得到氧</h2>
</div>
<div style="display:grid;grid-template-columns:640px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">
<svg aria-label="氧化銅把氧原子交給碳；銅被留下來，碳變成二氧化碳" width="640" height="380" viewBox="0 0 640 380">
<circle cx="80" cy="190" r="40" fill="#C8693A"/><text x="80" y="199" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Cu</text><circle cx="150" cy="190" r="30" fill="#B4521F"/><text x="150" y="199" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">O</text><text x="115" y="120" text-anchor="middle" font-size="30" font-weight="800" fill="#18262B">CuO</text><text x="260" y="202" text-anchor="middle" font-size="48" font-weight="700" fill="#4F5F64">+</text><circle cx="350" cy="190" r="38" fill="#2F3B40"/><text x="350" y="199" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">C</text><text x="350" y="120" text-anchor="middle" font-size="30" font-weight="800" fill="#18262B">C</text><line x1="150" y1="240" x2="314" y2="249" stroke="#B4521F" stroke-width="5" stroke-linecap="round"/><polygon points="330,250 315,240 314,258" fill="#B4521F"/><path d="M150 230 Q240 330 340 236" fill="none" stroke="#B4521F" stroke-width="5" stroke-dasharray="10 8"/><line x1="410" y1="190" x2="448" y2="190" stroke="#4F5F64" stroke-width="7" stroke-linecap="round"/><polygon points="470,190 448,178 448,202" fill="#4F5F64"/><circle cx="530" cy="120" r="36" fill="#C8693A"/><text x="530" y="129" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Cu</text><text x="530" y="70" text-anchor="middle" font-size="30" font-weight="800" fill="#18262B">Cu</text><circle cx="530" cy="270" r="34" fill="#2F3B40"/><text x="530" y="279" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">C</text><circle cx="588" cy="270" r="26" fill="#B4521F"/><text x="588" y="279" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">O</text><text x="560" y="340" text-anchor="middle" font-size="30" font-weight="800" fill="#18262B">CO₂</text><text x="115" y="300" text-anchor="middle" font-size="26" font-weight="800" fill="#2463B8">失去 O</text><text x="350" y="300" text-anchor="middle" font-size="26" font-weight="800" fill="#B4521F">得到 O</text>
</svg>
<p style="font-size:24px;color:#4F5F64">2CuO + C → 2Cu + CO₂</p>
</div>
<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5">CuO <b style="color:#2463B8">失去</b>氧 → 被<b>還原</b>成銅。</p>
<p style="font-size:34px;line-height:1.5">C <b style="color:#B4521F">得到</b>氧 → 被<b>氧化</b>成 CO₂。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">氧化和還原一定同時發生。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">氧化與還原 · 5</p>
<aside>用手指追著氧原子走：它從銅身上出發，最後到了碳身上。氧離開的那個被還原，氧加入的那個被氧化。</aside>
</section>
