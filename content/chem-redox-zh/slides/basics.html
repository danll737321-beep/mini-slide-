<section id="basics" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">開始之前</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">先認識四個詞</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">氧化</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">物質<b style="color:#18262B">得到氧</b>。鐵生鏽就是氧化。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">還原</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">物質<b style="color:#18262B">失去氧</b>。從鐵礦取出鐵就是還原。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">氧化劑</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">把自己的氧給出去（自己被還原）。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">還原劑</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">把別人的氧搶過來（自己被氧化）。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">氧化與還原 · 4</p>
<aside>橘色卡片是得到氧的一方，藍色卡片是失去氧的一方。名稱看起來是反的：還原劑自己是被氧化的那個。</aside>
</section>
