<section data-transition="fade" id="myth" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<h2 style="font-size:72px;font-weight:900;line-height:1.1">是對還是錯？</h2>
<div style="display:flex;flex-direction:column;gap:24px">
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">1　「氧化和還原是兩個分開的反應。」</p>
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">2　「金屬活性越大，越容易被還原。」</p>
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">3　「生鏽只是顏色改變，所以是物理變化。」</p>
</div>
<p style="font-size:28px;color:#4F5F64">說說看每一句錯在哪裡。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">氧化與還原 · 5</p>
<aside>三句都是錯的。1：氧化和還原一定同時發生。2：活性越大的金屬越容易被氧化，它的氧化物越難被還原。3：鐵鏽（氧化鐵）是新的物質，所以生鏽是化學變化，也是一種氧化。</aside>
</section>
