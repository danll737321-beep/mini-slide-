<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#FBF3EE">最常見的迷思</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">生鏽只是顏色改變嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.05">不是。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:34px;line-height:1.5">鐵鏽（氧化鐵）是<b>新的物質</b>：易碎、脆弱、橘褐色。所以生鏽是化學變化，也是一種氧化。</p>
<p style="font-size:34px;line-height:1.5">生鏽的鐵釘其實會變<b>重</b>，因為它從空氣中得到了氧原子。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">氧化與還原 · 12</p>
<aside>可以對比物理變化，例如把鐵釘折彎或冰融化：沒有產生新物質。</aside>
