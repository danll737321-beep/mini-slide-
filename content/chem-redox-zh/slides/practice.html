<section data-transition="fade" id="practice" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<h2 style="font-size:72px;font-weight:900;line-height:1.1">兩人練習</h2>
<div style="display:flex;gap:40px">
<div style="flex:1;display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:48px;border-radius:20px;border:2px solid #D3DCD8">
<p style="font-size:28px;font-weight:700;color:#B4521F">第 1 題</p>
<p style="font-size:44px;font-weight:700">2CuO + C → 2Cu + CO₂</p>
<p style="font-size:32px;line-height:1.45;color:#4F5F64">哪一種物質被氧化？哪一種被還原？哪一種是還原劑？</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:48px;border-radius:20px;border:2px solid #D3DCD8">
<p style="font-size:28px;font-weight:700;color:#B4521F">第 2 題</p>
<p style="font-size:44px;font-weight:700">Cu + FeSO₄ → ?</p>
<p style="font-size:32px;line-height:1.45;color:#4F5F64">銅片放進硫酸亞鐵溶液會反應嗎？為什麼？</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">氧化與還原 · 6</p>
<aside>第 1 題：C 得到氧，被氧化，是還原劑；CuO 失去氧，被還原，是氧化劑。第 2 題：不反應。銅的活性比鐵小，無法置換出鐵。</aside>
