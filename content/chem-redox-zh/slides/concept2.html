<section id="concept2" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">生鏽</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">鐵要同時碰到空氣和水才會生鏽</h2>
</div>
<div style="display:grid;grid-template-columns:640px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">
<svg aria-label="三支試管裡各有一根鐵釘：有空氣又有水的那支生鏽了；只有乾燥空氣、或水面蓋了一層油的都沒有生鏽" width="640" height="380" viewBox="0 0 640 380">
<path d="M40 50 V280 Q40 320 85 320 Q130 320 130 280 V50" fill="none" stroke="#18262B" stroke-width="5"/><path d="M45 200 H125 V278 Q125 314 85 314 Q45 314 45 278 Z" fill="#E1ECFA"/><rect x="76" y="70" width="18" height="230" rx="5" fill="#8C989C"/><ellipse cx="85" cy="170" rx="12" ry="8" fill="#A0522D"/><ellipse cx="85" cy="205" rx="12" ry="8" fill="#A0522D"/><ellipse cx="85" cy="240" rx="12" ry="8" fill="#A0522D"/><text x="85" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#18262B">空氣 + 水</text><path d="M270 50 V280 Q270 320 315 320 Q360 320 360 280 V50" fill="none" stroke="#18262B" stroke-width="5"/><rect x="306" y="70" width="18" height="230" rx="5" fill="#8C989C"/><text x="315" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#18262B">乾燥空氣</text><path d="M500 50 V280 Q500 320 545 320 Q590 320 590 280 V50" fill="none" stroke="#18262B" stroke-width="5"/><path d="M505 200 H585 V278 Q585 314 545 314 Q505 314 505 278 Z" fill="#E1ECFA"/><rect x="505" y="186" width="80" height="16" fill="#E0B020"/><rect x="536" y="70" width="18" height="230" rx="5" fill="#8C989C"/><text x="545" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#18262B">隔絕空氣</text>
</svg>
<p style="font-size:24px;color:#4F5F64">只有最左邊的鐵釘生鏽。</p>
</div>
<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5">生鏽是<b>緩慢的氧化</b>：鐵 + 氧 + 水 → 鐵鏽（氧化鐵）。</p>
<p style="font-size:34px;line-height:1.5">拿掉空氣或水，生鏽就停止。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">油漆、上油、鍍鋅，都是把氧和水隔開。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">氧化與還原 · 9</p>
<aside>可選活動：週一架好三支試管，幾天後再觀察。煮過的水上面加一層油，可以防止空氣再溶進水裡。</aside>
</section>
