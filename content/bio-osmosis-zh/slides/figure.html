</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px">
<p style="font-size:30px;line-height:1.5;background:#FBFCFA;padding:28px 32px;border:2px solid #D3DCD8;border-radius:20px">外面是<b>清水</b>：細胞比較鹹，水往<b>內</b>走。</p>
<p style="font-size:30px;line-height:1.5;background:#FBFCFA;padding:28px 32px;border:2px solid #D3DCD8;border-radius:20px"><b>濃度相同</b>：水進出一樣多，所以沒有變化。</p>

</div>
