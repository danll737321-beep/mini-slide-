<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">動物細胞和植物細胞</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">水太多，紅血球會脹破</h2>
</div>
<div style="display:grid;grid-template-columns:640px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">

<p style="font-size:24px;color:#4F5F64">紅血球放在三種液體裡。</p>

<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5"><b>動物細胞</b>只有一層薄膜，水進太多就可能脹破。</p>
<p style="font-size:34px;line-height:1.5"><b>植物細胞</b>有堅硬的細胞壁，水進來只會變硬，不會破。所以噴過水的生菜很爽脆。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">所以醫院的點滴用生理食鹽水，絕不用純水。</p>
</div>
</div>
