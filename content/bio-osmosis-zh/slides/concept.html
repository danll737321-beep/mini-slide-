<p style="font-size:24px;color:#4F5F64">一滴食用色素滴進靜止的水裡。</p>

<p style="font-size:34px;line-height:1.5">粒子一直在晃動、互相碰撞。</p>
<p style="font-size:34px;line-height:1.5">時間久了，它們會從<b>擁擠</b>的地方（濃度高）移到<b>空曠</b>的地方（濃度低）。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">不需要推它：擴散會自己發生。</p>
