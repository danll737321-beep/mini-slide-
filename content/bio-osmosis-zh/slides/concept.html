<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">細胞：滲透作用 · 4</p>
<aside>在黑板畫一個細胞，裡外各點幾個鹽點。關鍵句：水會往鹽比較多的一邊移動。回到開場：鹽在小黃瓜外面，所以水離開了小黃瓜的細胞。細胞膜讓水通過，但鹽不容易穿過。</aside>
