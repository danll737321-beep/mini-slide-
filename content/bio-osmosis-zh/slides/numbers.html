<aside>數據是典型結果，實際會有差異。可選實驗：上課前至少 40 分鐘，把一樣大的馬鈴薯條分別泡清水和 10% 鹽水各 3 條，課堂上讓兩人一組量長度、彎一彎。課堂上只泡 15 分鐘看不出差別。</aside>
