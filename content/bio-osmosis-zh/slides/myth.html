<div style="flex:1;background:#F3F5F2;border:2px solid #B4521F;border-radius:16px;padding:48px;display:flex;flex-direction:column;gap:20px">

<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">細胞：滲透作用 · 5</p>
<aside>學生常把「鹽比較多」理解成「鹽在移動」。用一句話收尾：鹽留在原地，移動的是水。時間不夠的話，可以在核心概念時口頭帶過，跳過這張。</aside>
