<section id="myth" data-section="破解迷思、小測驗與總結" data-transition="fade" style="background:#A84B1B;color:#FBF3EE;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#FBF3EE">最常見的迷思</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">是鹽跑進細胞裡嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.05">不是。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:34px;line-height:1.5">細胞膜讓<b>水</b>輕鬆通過，但鹽幾乎過不去。鹽留在原地，移動的是<b>水</b>。</p>
<p style="font-size:34px;line-height:1.5">所以撒鹽的小黃瓜是出水，而不是裡面變鹹：是水<b>跑出來</b>找鹽。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">細胞：滲透作用 · 12</p>
<aside>學生常把「鹽比較多」理解成「鹽在移動」。用一句話收尾：鹽不動，水在跑。</aside>
</section>
