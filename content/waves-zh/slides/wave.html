<p style="font-size:24px;color:#4F5F64">體育館的人浪：「站起來」這個動作往右傳，但每個人都留在自己的座位上。</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
<p style="font-size:32px;line-height:1.5;background:#FBFCFA;padding:32px;border-radius:20px">波是一個<b>振動</b>，一個推一個地傳出去。傳過去的是<b style="color:#B4521F">能量</b>，東西本身沒有跟著跑。</p>
<p style="font-size:32px;line-height:1.5;background:#FBFCFA;padding:32px;border-radius:20px">例子：丟石頭到池塘，漣漪往外擴散，但水面上的葉子只是<b>上下晃</b>，不會被沖走。</p>

<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">波動、聲音與光 · 4</p>
<aside>可以請全班做一次人浪。重點是：每個人只是站起來再坐下，沒有離開座位，但「站起來」這個動作卻傳到了教室另一頭。這就是波：傳能量，不傳東西。</aside>
