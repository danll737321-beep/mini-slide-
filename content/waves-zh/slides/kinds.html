<section id="kinds" data-transition="fade" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">

<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">波的兩種樣子</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">橫波和縱波</h2>
</div>
<div style="display:flex;gap:40px;flex:1">
<div style="flex:1;display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:48px;border:2px solid #D3DCD8;border-radius:24px">
<h3 style="font-size:44px;font-weight:700">橫波 <span style="color:#4F5F64">transverse</span></h3>
<svg aria-label="橫波：一條繩子上下起伏，藍色箭頭表示往右傳，橘色箭頭表示繩子上下振動" width="700" height="200" viewBox="0 0 700 200">
<path d="M20 100 C 70 20, 120 20, 170 100 S 270 180, 320 100 S 420 20, 470 100 S 570 180, 620 100" fill="none" stroke="#18262B" stroke-width="7" stroke-linecap="round"/>

<line x1="95" y1="70" x2="95" y2="150" stroke="#B4521F" stroke-width="6"/>

<polygon points="84,146 95,166 106,146" fill="#B4521F"/>
</svg>
<p style="font-size:32px;line-height:1.5">像甩繩子：繩子<b style="color:#B4521F">上下</b>振動，波往<b style="color:#2463B8">右</b>傳，兩個方向互相垂直。</p>
<p style="font-size:28px;color:#4F5F64">例子：繩波、<b style="color:#18262B">光</b></p>
</div>

<svg aria-label="縱波：一排直線有的擠在一起、有的分得很開，像彈簧被推拉；藍色箭頭表示往右傳，橘色雙箭頭表示前後振動" width="700" height="200" viewBox="0 0 700 200">

<line x1="482" y1="50" x2="482" y2="150"/><line x1="500" y1="50" x2="500" y2="150"/><line x1="516" y1="50" x2="516" y2="150"/><line x1="530" y1="50" x2="530" y2="150"/>

<p style="font-size:32px;line-height:1.5">像推拉彈簧：彈簧<b style="color:#B4521F">前後</b>擠壓、拉開，波也往<b style="color:#2463B8">右</b>傳，兩個方向相同。</p>
<p style="font-size:28px;color:#4F5F64">例子：彈簧波、<b style="color:#18262B">聲音</b></p>
</div>
</div>
