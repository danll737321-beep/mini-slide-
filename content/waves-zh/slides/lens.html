<section id="lens" data-transition="fade" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">

</div>
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">

<line x1="60" y1="270" x2="700" y2="270" stroke="#E0A21A" stroke-width="8"/>

<line x1="700" y1="170" x2="1100" y2="170" stroke="#E0A21A" stroke-width="8"/>
<ellipse cx="700" cy="170" rx="36" ry="150" fill="#9CC0EA" opacity="0.6" stroke="#2463B8" stroke-width="5"/>

<p style="font-size:24px;color:#4F5F64">平行光穿過凸透鏡後聚在一點（橘色點），下方的橘色線是焦距。</p>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px">
<p style="font-size:32px;line-height:1.5;background:#FBFCFA;padding:32px;border-radius:20px"><b>凸透鏡</b>：中間厚、邊緣薄，像放大鏡。</p>
<p style="font-size:32px;line-height:1.5;background:#FBFCFA;padding:32px;border-radius:20px"><b style="color:#B4521F">焦點 F</b>：平行光聚集的那一點。</p>
<p style="font-size:32px;line-height:1.5;background:#FBFCFA;padding:32px;border-radius:20px"><b style="color:#B4521F">焦距 f</b>：透鏡中心到焦點的距離。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">波動、聲音與光 · 12</p>
<aside>可以在太陽下用放大鏡把光聚成一個小亮點，那就是焦點（注意不要對著眼睛或易燃物）。提醒學生：這裡的 f 是焦距，和前面波速公式裡的頻率 f 是不同的東西，只是剛好用同一個字母。</aside>
