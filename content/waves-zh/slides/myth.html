<h2 style="font-size:72px;font-weight:900;line-height:1.15">凸透鏡一定會把東西放大嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.1">不一定。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:36px;line-height:1.5">物體在<b>焦距以內</b>，才會看到正立、放大的虛像，這就是放大鏡平常的用法。</p>
<p style="font-size:36px;line-height:1.5">拿放大鏡看<b>遠方的窗戶</b>，看到的是<b>倒立、縮小</b>的像，跟相機拍照的原理一樣。</p>
