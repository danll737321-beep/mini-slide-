<section data-section="光：反射、折射與凸透鏡成像" data-transition="fade" id="reflect" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">

<h2 style="font-size:72px;font-weight:900;line-height:1.15">光的反射</h2>
</div>
<div style="display:grid;grid-template-columns:760px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">

<p style="font-size:24px;color:#4F5F64">虛線是垂直鏡面的「法線」，兩個橘色角度一樣大。</p>

<div style="display:flex;flex-direction:column;gap:32px">
<p style="font-size:36px;line-height:1.5">光在同一種物質裡<b>走直線</b>，所以被擋住就會有影子。</p>
<p style="font-size:36px;line-height:1.5">光打到光滑的表面會<b>反彈</b>，就像球打到牆壁彈回來。</p>
<p style="font-size:44px;font-weight:700;line-height:1.4;color:#B4521F">入射角 = 反射角</p>
<p style="font-size:28px;line-height:1.5;color:#4F5F64">例子：照鏡子、平靜湖面的倒影、腳踏車的反光片。</p>
</div>
