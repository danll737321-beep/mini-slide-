<section id="reflect" data-section="光：反射、折射與凸透鏡成像" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">光 Light</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">光的反射 reflection</h2>
</div>
<div style="display:grid;grid-template-columns:760px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">
<svg aria-label="光的反射：一道光斜斜打到鏡面後反彈出去，中間虛線是法線，左右兩個角度一樣大" width="760" height="420" viewBox="0 0 760 420">
<rect x="60" y="340" width="640" height="24" fill="#9CC0EA" stroke="#2463B8" stroke-width="4"/>

<line x1="380" y1="40" x2="380" y2="340" stroke="#4F5F64" stroke-width="4" stroke-dasharray="14 10"/>
<line x1="140" y1="100" x2="380" y2="340" stroke="#E0A21A" stroke-width="10" stroke-linecap="round"/>
<polygon points="262,206 290,250 246,236" fill="#E0A21A"/>

<p style="font-size:24px;color:#4F5F64">虛線是垂直鏡面的「法線」，兩個橘色角度一樣大。</p>
</div>
<div style="display:flex;flex-direction:column;gap:32px">
<p style="font-size:36px;line-height:1.5">光在同一種物質裡<b>走直線</b>，所以被擋住就會有影子。</p>
<p style="font-size:36px;line-height:1.5">光打到光滑的表面會<b>反彈</b>，就像球打到牆壁彈回來。</p>
<p style="font-size:44px;font-weight:700;line-height:1.4;color:#B4521F">入射角 = 反射角</p>
<p style="font-size:28px;line-height:1.5;color:#4F5F64">例子：照鏡子、平靜湖面的倒影、腳踏車的反光片。</p>
</div>
</div>
