<section id="rays" data-transition="fade" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">畫圖找出像</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">兩條光線，就能找到像在哪裡</h2>
</div>
<div style="display:flex;flex-direction:column;gap:12px;align-items:center">
<svg aria-label="成像作圖：物體在透鏡左邊，一條光線平行主軸射到透鏡後穿過右邊焦點，另一條穿過透鏡中心直線前進，兩線在右邊交會，形成倒立放大的像" width="1500" height="340" viewBox="0 0 1500 340">
<line x1="40" y1="200" x2="1460" y2="200" stroke="#9AAAA6" stroke-width="3" stroke-dasharray="12 10"/>
<ellipse cx="700" cy="200" rx="30" ry="150" fill="#9CC0EA" opacity="0.6" stroke="#2463B8" stroke-width="5"/>
<circle cx="500" cy="200" r="12" fill="#B4521F"/>
<circle cx="900" cy="200" r="12" fill="#B4521F"/>
<line x1="400" y1="200" x2="400" y2="164" stroke="#18262B" stroke-width="10"/>
<polygon points="384,168 400,140 416,168" fill="#18262B"/>
<line x1="400" y1="140" x2="700" y2="140" stroke="#E0A21A" stroke-width="7"/>
<line x1="700" y1="140" x2="1300" y2="320" stroke="#E0A21A" stroke-width="7"/>
<line x1="400" y1="140" x2="1300" y2="320" stroke="#2463B8" stroke-width="7"/>
<line x1="1300" y1="200" x2="1300" y2="296" stroke="#B4521F" stroke-width="10"/>
<polygon points="1284,292 1300,322 1316,292" fill="#B4521F"/>
</svg>
<p style="font-size:24px;color:#4F5F64">橘點是焦點。焦距 10 cm、物體放在 15 cm 處 → 像在另一側 30 cm，倒立、放大 2 倍的實像。</p>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:32px;border:2px solid #D3DCD8;border-left:12px solid #E0A21A;border-radius:20px">
<h3 style="font-size:36px;font-weight:700">黃色光線</h3>
<p style="font-size:28px;line-height:1.5">平行主軸射向透鏡 → 穿過後<b>經過另一側的焦點</b>。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:32px;border:2px solid #D3DCD8;border-left:12px solid #2463B8;border-radius:20px">
<h3 style="font-size:36px;font-weight:700">藍色光線</h3>
<p style="font-size:28px;line-height:1.5">經過透鏡中心 → <b>直直前進，不會偏折</b>。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">波動、聲音與光 · 14</p>
<aside>兩條線的交點就是像的位置。作圖題只要記住這兩條光線就夠了。這一例的物體在焦距和 2 倍焦距之間，所以對照上一張表，是倒立放大的實像，就是投影機的原理。</aside>
</section>
