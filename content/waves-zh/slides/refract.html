<section data-transition="fade" id="refract" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">光</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">光的折射</h2>
</div>
<div style="display:grid;grid-template-columns:640px 1fr;gap:64px;align-items:center;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;align-items:center">
<svg aria-label="一杯水裡插著一根筷子，筷子在水面的地方看起來像折斷了一樣" height="440" viewbox="0 0 640 440" width="640">
<path d="M150 60 L180 420 L460 420 L490 60" fill="none" stroke="#4F5F64" stroke-linejoin="round" stroke-width="8"></path>
<path d="M163 200 L180 420 L460 420 L477 200 Z" fill="#9CC0EA" opacity="0.7"></path>
<line stroke="#2463B8" stroke-width="5" x1="163" x2="477" y1="200" y2="200"></line>
<line stroke="#8A5A2B" stroke-linecap="round" stroke-width="16" x1="230" x2="330" y1="20" y2="200"></line>
<line stroke="#8A5A2B" stroke-linecap="round" stroke-width="16" x1="330" x2="452" y1="200" y2="318"></line>
<line opacity="0.5" stroke="#8A5A2B" stroke-dasharray="10 10" stroke-width="6" x1="330" x2="430" y1="200" y2="380"></line>
</svg>
<p style="font-size:24px;color:#4F5F64">實線是看到的筷子；淡淡的虛線是筷子真正的位置。</p>
</div>
<div style="display:flex;flex-direction:column;gap:32px">
<p style="font-size:36px;line-height:1.5">光從水進入空氣時<b>速度改變</b>，前進方向就會<b style="color:#B4521F">偏折</b>，這叫做折射。</p>
<p style="font-size:36px;line-height:1.5">所以筷子在水面的地方看起來<b>像折斷了</b>，其實它還是直的。</p>
<p style="font-size:28px;line-height:1.5;color:#4F5F64">其他例子：游泳池看起來比實際淺；眼鏡和放大鏡都是利用折射讓光轉彎。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">波動、聲音與光 · 11</p>
<aside>課堂上直接拿透明杯裝水、插一根筷子，從側面看。提醒學生：反射是光「彈回來」，折射是光「穿過去但轉彎」。透鏡就是利用折射。</aside>
