<section data-transition="fade" id="medium" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">聲音需要介質</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">太空中聽得到爆炸聲嗎？</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:56px;flex:1">
<div style="display:flex;flex-direction:column;gap:24px">
<p style="font-size:96px;font-weight:900;line-height:1.1;color:#B4521F">聽不到。</p>
<p style="font-size:32px;line-height:1.5">聲音靠介質裡的粒子<b>一個推一個</b>傳過去。太空是真空，沒有粒子可以推，聲音就傳不出去。</p>
<p style="font-size:32px;line-height:1.5">光不需要介質，所以太陽光可以穿過太空照到地球。</p>
</div>
<div style="display:flex;flex-direction:column;gap:24px">
<table style="font-size:32px;color:#18262B">
<tr><th style="width:50%;text-align:left">在什麼裡面</th><th style="width:50%;text-align:right">傳播速度（約）</th></tr>
<tr><td>空氣中的聲音</td><td style="text-align:right">340 m/s</td></tr>
<tr><td>水中的聲音</td><td style="text-align:right">1,500 m/s</td></tr>
<tr><td>鋼鐵中的聲音</td><td style="text-align:right">5,000 m/s</td></tr>
<tr style="background:#E1ECFA"><td><b>光</b></td><td style="text-align:right"><b>300,000,000 m/s</b></td></tr>
</table>
<p style="font-size:28px;line-height:1.5;color:#4F5F64">光比聲音快得多，所以打雷時<b style="color:#18262B">先看到閃電，才聽到雷聲</b>。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">波動、聲音與光 · 9</p>
<aside>電影裡太空爆炸「轟」的一聲是音效，真實的太空是安靜的。延伸：從看到閃電到聽到雷聲數幾秒，乘以 340，大約就是閃電離你幾公尺。數值都是約略值，聲速會隨溫度和材料改變。</aside>
