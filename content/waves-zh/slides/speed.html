<section data-transition="fade" id="speed" style="background:#18262B;color:#F3F5F2;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px;justify-content:center">
<p style="font-size:32px;font-weight:700;letter-spacing:4px;color:#E58A55">波速公式</p>
<div style="display:flex;align-items:flex-end;gap:56px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:200px;font-weight:700;line-height:1;color:#F3F5F2">v</p>
<p style="font-size:32px;color:#BFCDC9">波速 m/s</p>
</div>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:160px;line-height:1.1;color:#BFCDC9">=</p>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:200px;font-weight:700;line-height:1;color:#7FB0F2">f</p>
<p style="font-size:32px;color:#BFCDC9">頻率 Hz</p>
</div>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:160px;line-height:1.1;color:#BFCDC9">×</p>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:200px;font-weight:700;line-height:1;color:#E58A55">λ</p>
<p style="font-size:32px;color:#BFCDC9">波長 m</p>
</div>
</div>
<p style="font-size:44px;font-weight:700;line-height:1.4">例：空氣中聲速約 340 m/s，170 Hz 的聲音<br/>波長 λ = v ÷ f = 340 ÷ 170 = <span style="color:#E58A55">2 公尺</span></p>
<p style="font-size:24px;line-height:1.5;color:#BFCDC9">同一種波、同一個介質裡波速不變：頻率越高，波長就越短。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#BFCDC9">波動、聲音與光 · 6</p>
<aside>可以這樣理解：每秒振動 f 次，每次前進一個波長 λ，所以每秒前進 f × λ。和歐姆定律一樣，三個量知道兩個就能算第三個。聲速 340 m/s 大約是 15°C 空氣中的值。</aside>
</section>
