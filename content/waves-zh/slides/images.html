<section data-transition="fade" id="images" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">凸透鏡成像規律</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">物體放多遠，就成什麼樣的像</h2>
</div>
<table style="font-size:32px;color:#18262B">
<tr><th style="width:34%;text-align:left">物距（物體到透鏡）</th><th style="width:38%;text-align:left">像的樣子</th><th style="width:28%;text-align:left">應用</th></tr>
<tr><td>大於 2 倍焦距</td><td>倒立、縮小、實像</td><td>相機、眼睛</td></tr>
<tr><td>等於 2 倍焦距</td><td>倒立、等大、實像</td><td>—</td></tr>
<tr style="background:#F7E6DC"><td>在焦距和 2 倍焦距之間</td><td>倒立、放大、實像</td><td>投影機</td></tr>
<tr><td>等於焦距</td><td>不成像</td><td>—</td></tr>
<tr style="background:#E1ECFA"><td>小於焦距</td><td>正立、放大、虛像</td><td>放大鏡</td></tr>
</table>
<p style="font-size:28px;line-height:1.5;color:#4F5F64"><b style="color:#18262B">實像</b>：可以投影在屏幕上。<b style="color:#18262B">虛像</b>：只能透過透鏡看到，投影不出來。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">波動、聲音與光 · 13</p>
<aside>記憶口訣：物體越靠近焦點，像越大；一進入焦距以內，就變成正立的放大虛像。可以拿放大鏡從遠到近看一個字，親眼看到像從倒立縮小、倒立放大，到正立放大的變化。</aside>
</section>
