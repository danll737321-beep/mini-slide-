<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;flex:1">
<div style="display:flex;flex-direction:column;gap:16px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-top:12px solid #B4521F;border-radius:24px">
<h3 style="font-size:44px;font-weight:700">波長 <span style="color:#B4521F">λ</span></h3>
<p style="font-size:24px;color:#4F5F64">單位：公尺（m）</p>
<p style="font-size:32px;line-height:1.5">相鄰兩個<b>波峰</b>之間的距離（橘色括號）。</p>
</div>
<div style="display:flex;flex-direction:column;gap:16px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-top:12px solid #2463B8;border-radius:24px">
<h3 style="font-size:44px;font-weight:700">振幅</h3>
<p style="font-size:24px;color:#4F5F64">波的高度</p>
<p style="font-size:32px;line-height:1.5">波峰離中線<b>有多高</b>（藍色線）。振幅越大，能量越大。</p>
</div>
<div style="display:flex;flex-direction:column;gap:16px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-top:12px solid #18262B;border-radius:24px">
<h3 style="font-size:44px;font-weight:700">頻率 <span style="color:#4F5F64">f</span></h3>
<p style="font-size:24px;color:#4F5F64">單位：赫茲（Hz）</p>
<p style="font-size:32px;line-height:1.5"><b>每秒振動幾次</b>。100 Hz 就是每秒振動 100 次。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">波動、聲音與光 · 5</p>
<aside>波長和振幅可以在圖上直接看到；頻率要用時間來看，就是每秒鐘有幾個波經過。用跳繩舉例：甩得越快，頻率越高；甩得越用力、繩子晃得越高，振幅越大。</aside>
