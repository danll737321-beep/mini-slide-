<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">聲音</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">聲音的三要素</h2>
</div>
<table style="font-size:34px;color:#18262B">
<tr><th style="width:24%;text-align:left">要素</th><th style="width:34%;text-align:left">由什麼決定</th><th style="width:42%;text-align:left">生活例子</th></tr>
<tr><td><b>響度</b></td><td><span style="color:#2463B8">振幅</span>：越大越大聲</td><td>輕聲說話 對比 大聲喊叫</td></tr>
<tr><td><b>音調</b></td><td><span style="color:#B4521F">頻率</span>：越高越尖</td><td>小鳥叫（高）對比 打大鼓（低）</td></tr>
<tr><td><b>音色</b></td><td>波形：每種樂器不同</td><td>鋼琴和小提琴彈同一個音，還是聽得出差別</td></tr>
</table>
<div style="flex:1"></div>
<p style="font-size:32px;line-height:1.5;background:#FBFCFA;padding:24px 32px;border-radius:16px">人耳大約聽得到 <b>20–20,000 Hz</b> 的聲音。比這更高的叫超音波，狗和蝙蝠聽得到。</p>
