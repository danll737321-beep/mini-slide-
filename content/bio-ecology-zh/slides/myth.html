<section id="myth" data-section="破解迷思、小測驗與總結" data-transition="fade" style="background:#A84B1B;color:#FBF3EE;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#FBF3EE">最常見的迷思</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">箭頭是指向被吃的一方嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.05">不是。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:34px;line-height:1.5">箭頭代表<b>能量的流向</b>：從食物指向吃牠的生物。所以是草 → 兔子 → 狼，不是狼 → 兔子 → 草。</p>
<p style="font-size:34px;line-height:1.5">把每個箭頭都讀成<b>「被……吃」</b>，就不會畫反。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">生態：食物網與能量金字塔 · 12</p>
<aside>學生自己畫食物網時，請他們檢查每個箭頭都是從生產者往上指。</aside>
