<h2 style="font-size:72px;font-weight:900;line-height:1.15">先認識四個詞</h2>

<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">生產者</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">利用陽光自己製造養分，例如草和樹。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">消費者</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">吃其他生物來獲得能量，例如兔子和狼。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">分解者</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">分解死去的生物，把養分還給土壤：細菌、真菌。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">食物網</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">許多食物鏈連在一起，因為大多數動物不只吃一種東西。</p>
</div>
