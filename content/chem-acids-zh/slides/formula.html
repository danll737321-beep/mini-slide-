<p style="font-size:32px;font-weight:700;letter-spacing:4px;color:#E58A55">中和反應</p>
<div style="display:flex;align-items:flex-end;gap:48px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:160px;font-weight:700;line-height:1;color:#E58A55">H⁺</p>
<p style="font-size:32px;color:#BFCDC9">來自酸</p>
</div>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:140px;line-height:1.1;color:#BFCDC9">+</p>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:160px;font-weight:700;line-height:1;color:#7FB0F2">OH⁻</p>
<p style="font-size:32px;color:#BFCDC9">來自鹼</p>
</div>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:140px;line-height:1.1;color:#BFCDC9">→</p>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:160px;font-weight:700;line-height:1;color:#F3F5F2">H₂O</p>
<p style="font-size:32px;color:#BFCDC9">水</p>
</div>
</div>
<p style="font-size:48px;font-weight:700;line-height:1.4">酸 + 鹼 → 鹽 + 水</p>
<p style="font-size:28px;line-height:1.5;color:#BFCDC9">例：HCl + NaOH → NaCl + H₂O（鹽酸 + 氫氧化鈉 → 食鹽 + 水）</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#BFCDC9">酸、鹼、鹽 · 8</p>
<aside>酸的 H⁺ 和鹼的 OH⁻ 結合成水，兩者就互相抵消了，剩下的部分組成鹽。這就是胃藥（鹼性）能中和胃酸的原因。</aside>
