<h2 style="font-size:72px;font-weight:900;line-height:1.15">0 到 14：酸性、中性、鹼性</h2>
</div>
<div style="display:flex;flex-direction:column;gap:12px;align-items:center">
<svg aria-label="pH 色帶從 0 到 14，酸性那端是橘色，7 是灰色，鹼性那端是藍色，上面標出生活中的東西" width="1600" height="210" viewBox="0 0 1600 210">

<rect x="40" y="100" width="1520" height="50" rx="25" fill="url(#phscale)"/>
<line x1="257.1428571428571" y1="38" x2="257.1428571428571" y2="96" stroke="#18262B" stroke-width="3"/><text x="257.1428571428571" y="30" text-anchor="middle" font-size="28" font-weight="800" fill="#18262B">檸檬汁</text><line x1="365.7142857142857" y1="70" x2="365.7142857142857" y2="96" stroke="#18262B" stroke-width="3"/><text x="365.7142857142857" y="62" text-anchor="middle" font-size="28" font-weight="800" fill="#18262B">白醋</text><line x1="800.0" y1="38" x2="800.0" y2="96" stroke="#18262B" stroke-width="3"/><text x="800.0" y="30" text-anchor="middle" font-size="28" font-weight="800" fill="#18262B">純水</text><line x1="1017.1428571428571" y1="70" x2="1017.1428571428571" y2="96" stroke="#18262B" stroke-width="3"/><text x="1017.1428571428571" y="62" text-anchor="middle" font-size="28" font-weight="800" fill="#18262B">小蘇打水</text><line x1="1125.7142857142858" y1="38" x2="1125.7142857142858" y2="96" stroke="#18262B" stroke-width="3"/><text x="1125.7142857142858" y="30" text-anchor="middle" font-size="28" font-weight="800" fill="#18262B">肥皂水</text><line x1="1451.4285714285713" y1="70" x2="1451.4285714285713" y2="96" stroke="#18262B" stroke-width="3"/><text x="1451.4285714285713" y="62" text-anchor="middle" font-size="28" font-weight="800" fill="#18262B">漂白水</text>

<p style="font-size:24px;color:#4F5F64">小於 7 是酸性，等於 7 是中性，大於 7 是鹼性。離 7 越遠，越強。</p>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px">
<p style="font-size:30px;line-height:1.5;background:#FBFCFA;padding:28px 32px;border:2px solid #D3DCD8;border-radius:20px"><b style="color:#B4521F">小於 7</b>：酸性。檸檬汁大約是 2。</p>
<p style="font-size:30px;line-height:1.5;background:#FBFCFA;padding:28px 32px;border:2px solid #D3DCD8;border-radius:20px"><b>等於 7</b>：中性。純水。</p>
<p style="font-size:30px;line-height:1.5;background:#FBFCFA;padding:28px 32px;border:2px solid #D3DCD8;border-radius:20px"><b style="color:#2463B8">大於 7</b>：鹼性。漂白水大約是 13。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">酸、鹼、鹽 · 6</p>
<aside>數值是大約值，實際產品會有差異。可以點出汽水是酸性的，雖然喝起來甜，那是糖蓋過了酸味。</aside>
