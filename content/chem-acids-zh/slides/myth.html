<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#FBF3EE">最常見的迷思</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">「鹽」就是食鹽嗎？</h2>
</div>
<p style="font-size:160px;font-weight:900;line-height:1.05">不是。</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px">
<p style="font-size:34px;line-height:1.5">在化學裡，<b>鹽</b>是酸和鹼中和後產生的化合物的總稱。食鹽（NaCl）只是其中一種。</p>
<p style="font-size:34px;line-height:1.5">小蘇打、粉筆（碳酸鈣）和許多肥料也都是<b>鹽</b>，而且大部分吃起來一點也不鹹。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#FBF3EE">酸、鹼、鹽 · 13</p>
<aside>回扣中和反應：換一種酸或鹼，就會產生不同的鹽。HCl + KOH 會產生 KCl，就是低鈉鹽的成分。</aside>
</section>
