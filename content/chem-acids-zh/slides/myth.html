<section data-transition="fade" id="myth" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<h2 style="font-size:72px;font-weight:900;line-height:1.1">是對還是錯？</h2>
<div style="display:flex;flex-direction:column;gap:24px">
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">1　「pH 3 只比 pH 5 酸一點點。」</p>
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">2　「鹽就是食鹽。」</p>
<p style="font-size:32px;line-height:1.45;background:#FBFCFA;padding:32px 40px;border-radius:16px;border-left:8px solid #B4521F">3　「糖水會導電，因為糖會溶解。」</p>
</div>
<p style="font-size:28px;color:#4F5F64">說說看每一句錯在哪裡。</p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">酸、鹼、鹽 · 5</p>
<aside>三句都是錯的。1：[H⁺] 差了 100 倍。2：「鹽」是中和反應產生的離子化合物的總稱，NaCl 只是其中一種。3：溶解不等於解離成離子；糖是非電解質，不導電。</aside>
</section>
