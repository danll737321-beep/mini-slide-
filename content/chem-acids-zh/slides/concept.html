<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5">酸溶在水裡，會放出 <b style="color:#B4521F">H⁺</b>（氫離子）。</p>
<p style="font-size:34px;line-height:1.5">鹼溶在水裡，會放出 <b style="color:#2463B8">OH⁻</b>（氫氧根離子）。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">H⁺ 越多越酸，OH⁻ 越多越鹼。</p>
