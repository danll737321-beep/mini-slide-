<section data-transition="fade" id="concept" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<h2 style="font-size:72px;font-weight:900;line-height:1.1">核心概念</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">1 電解質</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">在水中會解離成離子，所以能導電。酸、鹼、鹽都是電解質。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">2 酸和鹼</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">酸在水中釋出 H⁺。<br/>鹼在水中釋出 OH⁻。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">3 pH 值（25°C）</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">&lt; 7 酸性 · = 7 中性 · &gt; 7 鹼性<br/>每差 1，[H⁺] 就差 10 倍</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:36px;border-radius:16px;border-top:6px solid #B4521F">
<h3 style="font-size:32px;font-weight:800">4 中和反應</h3>
<p style="font-size:28px;line-height:1.45;color:#4F5F64">酸 + 鹼 → 鹽 + 水<br/>本質是：H⁺ + OH⁻ → H₂O</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">酸、鹼、鹽 · 4</p>
<aside>回扣開場：紫甘藍汁是天然指示劑，顏色顯示 H⁺ 或 OH⁻ 有多少。強調 pH 是對數刻度，出場單會考。</aside>
</section>
