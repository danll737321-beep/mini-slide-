<section id="example" data-transition="fade" style="background:#F3F5F2;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">例題</p>
<h2 style="font-size:64px;font-weight:900;line-height:1.15">pH 2 的溶液，H⁺ 是 pH 5 溶液的幾倍？</h2>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">1</p>
<h3 style="font-size:36px;font-weight:700">算出差距</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">5 − 2 = 3</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">2</p>
<h3 style="font-size:36px;font-weight:700">每差 1 乘 10</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">差 3 步</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">3</p>
<h3 style="font-size:36px;font-weight:700">連乘</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">10 × 10 × 10</p>
</div>
<div style="display:flex;flex-direction:column;gap:20px;background:#FBFCFA;padding:40px;border:2px solid #D3DCD8;border-radius:24px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;font-weight:700;color:#B4521F">4</p>
<h3 style="font-size:36px;font-weight:700">答案</h3>
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:32px;line-height:1.6">= 1,000</p>
</div>
</div>
<p style="font-size:44px;font-weight:700;background:#E1ECFA;padding:28px 40px;border-radius:20px">pH 2 的 H⁺ 是 <span style="color:#2463B8">1,000 倍</span></p>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">酸、鹼、鹽 · 12</p>
<aside>最常見的錯誤答案是 3 倍：學生相減後就停了。提醒他們每差 1 都要乘以 10。</aside>
</section>
