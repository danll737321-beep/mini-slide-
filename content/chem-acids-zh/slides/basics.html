<section id="basics" data-transition="fade" style="background:#E7EEEA;color:#18262B;font-family:'Noto Sans TC', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#B4521F">開始之前</p>
<h2 style="font-size:72px;font-weight:900;line-height:1.15">先認識四個詞</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1">
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">酸</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">嚐起來酸。檸檬汁、白醋、汽水都是酸性。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">鹼</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">摸起來滑。肥皂、小蘇打、漂白水都是鹼性。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #B4521F">
<h3 style="font-size:40px;font-weight:700">pH</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">從 <b style="color:#18262B">0 到 14</b> 的數字，表示東西有多酸或多鹼。</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FBFCFA;padding:40px;border-radius:24px;border-left:12px solid #2463B8">
<h3 style="font-size:40px;font-weight:700">指示劑</h3>
<p style="font-size:30px;line-height:1.5;color:#4F5F64">顏色會隨 pH 改變的染料，例如紫甘藍汁。</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:900px;font-size:24px;color:#4F5F64">酸、鹼、鹽 · 4</p>
<aside>橘色卡片是酸那一邊，藍色卡片是鹼那一邊，整份簡報都用這個顏色規則。安全提醒：實驗室裡不明的化學藥品絕對不能嚐或摸，這裡說的味道都來自日常食物。</aside>
</section>
