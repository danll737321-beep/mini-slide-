<h2 style="font-size:72px;font-weight:900;line-height:1.15">酸、鹼、鹽的水溶液會導電</h2>
</div>

<p style="font-size:24px;color:#4F5F64">鹽水：燈泡亮了。</p>
</div>
<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.5">酸、鹼、鹽在水中會分成<b>帶電的粒子</b>（離子）。</p>
<p style="font-size:34px;line-height:1.5">帶電粒子移動就能傳電，所以燈泡會亮。</p>
<p style="font-size:34px;font-weight:700;line-height:1.4;background:#FBFCFA;padding:24px 32px;border-radius:16px">糖會溶解，但不會分成離子，所以糖水不導電。</p>
</div>
